[package]
name = "xsheet-remap"
version = "0.1.712"
description = "CSP timesheet remapping workflow"
authors = ["xsheet-remap contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "xsheet_remap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
xsheet-desktop-runtime = { path = "../../../native/desktop-runtime" }

[profile.release]
debug = false
strip = true
