[package]
name = "xsheet-corrector"
version = "0.1.729"
description = "Batch sheet image correction utility"
authors = ["xsheet-remap contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "xsheet_corrector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "tga"] }

[profile.release]
debug = false
strip = true
