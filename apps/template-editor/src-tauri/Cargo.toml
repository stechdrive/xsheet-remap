[package]
name = "xsheet-template-editor"
version = "0.1.492"
description = "Sheet template authoring and validation tool"
authors = ["xsheet-remap contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "xsheet_template_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
debug = false
strip = true
