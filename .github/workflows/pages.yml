name: CI and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: windows-latest
    outputs:
      native: ${{ steps.plan.outputs.native }}
      importer: ${{ steps.plan.outputs.importer }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - id: plan
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: node tools/verification/run.mjs plan --base="$env:BASE_REVISION"
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
      - run: npm ci
      - run: npm run check:dependency-audit
      - run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-evidence
          path: reference-local/verification
          retention-days: 14
  native:
    runs-on: windows-latest
    needs: plan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.native == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: native-${{ runner.os }}-${{ hashFiles('native/**', 'apps/*/src-tauri/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: native-${{ runner.os }}-
      - run: npm run verify:native
        if: needs.plan.outputs.native == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.plan.outputs.importer == 'true'
        with:
          python-version: '3.14'
      - run: python -m pip install -r apps/csp-import-helper/requirements/test.txt
        if: needs.plan.outputs.importer == 'true'
      - run: npm run verify:importer
        if: needs.plan.outputs.importer == 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-evidence
          path: reference-local/verification
          if-no-files-found: ignore
          retention-days: 14
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run verify:pages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: apps/web/dist-pages
          if-no-files-found: error
          retention-days: 7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/dist-pages
  browser:
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit, chromium-touch, webkit-touch]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: apps/web/dist-pages
      - run: npx playwright install chromium webkit
      - run: npm run verify:browser -- --project=${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}
          path: |
            reference-local/verification
            reference-local/canvaskit-browser
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    runs-on: ubuntu-latest
    needs: [check, native, build, browser]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
