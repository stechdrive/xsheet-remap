[package]
name = "xsheet-editor"
version = "0.1.580"
description = "Full digital exposure sheet editor"
authors = ["xsheet-remap contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "xsheet_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
xsheet-desktop-runtime = { path = "../../../native/desktop-runtime" }

[profile.release]
debug = false
strip = true
