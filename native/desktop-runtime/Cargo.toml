[package]
name = "xsheet-desktop-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
after-effects = ["dep:windows-sys"]

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
